<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Погода рядом</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: rgba(255, 255, 255, .82);
      --surface-solid: #fff;
      --ink: #172033;
      --muted: #6f7a90;
      --line: rgba(26, 42, 75, .1);
      --accent: #3678e8;
      --accent-soft: #eaf2ff;
      --shadow: 0 24px 70px rgba(49, 76, 125, .12);
      --radius: 24px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101522;
        --surface: rgba(28, 37, 57, .84);
        --surface-solid: #1c2539;
        --ink: #edf2ff;
        --muted: #9ca8c0;
        --line: rgba(232, 239, 255, .1);
        --accent: #76a7ff;
        --accent-soft: #243554;
        --shadow: 0 24px 70px rgba(0, 0, 0, .2);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(99, 164, 255, .18), transparent 35%),
        radial-gradient(circle at 90% 10%, rgba(255, 192, 105, .16), transparent 30%),
        var(--bg);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { width: min(100% - 32px, 720px); margin: 0 auto; padding: 42px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 750; letter-spacing: -.02em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: #fff; background: linear-gradient(135deg, #3678e8, #75b7ff); box-shadow: 0 8px 22px rgba(54, 120, 232, .3); font-size: 20px; }
    .eyebrow { margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); letter-spacing: -.045em; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #50c790; box-shadow: 0 0 0 4px rgba(80, 199, 144, .14); }

    .search { display: flex; gap: 10px; margin-bottom: 22px; }
    .search-wrap { display: flex; align-items: center; flex: 1; gap: 10px; padding: 0 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: 0 8px 24px rgba(30, 56, 102, .05); }
    .search-wrap svg { flex: 0 0 auto; color: var(--muted); }
    input { width: 100%; padding: 14px 0; border: 0; outline: 0; color: var(--ink); background: transparent; font: inherit; }
    button { border: 0; border-radius: 15px; padding: 0 20px; color: #fff; background: var(--accent); font: 700 14px inherit; cursor: pointer; transition: transform .18s ease, filter .18s ease; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: wait; transform: none; }

    .current { position: relative; overflow: hidden; padding: 27px; border: 1px solid rgba(255,255,255,.22); border-radius: var(--radius); color: #fff; background: linear-gradient(135deg, #3477e7, #5da9ed 58%, #8ac8e7); box-shadow: 0 20px 38px rgba(54, 120, 232, .24); }
    .current::after { content: "☼"; position: absolute; top: -41px; right: -18px; color: rgba(255,255,255,.18); font-size: 190px; line-height: 1; }
    .current-top, .current-bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .current-location { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    .current-date { margin: 3px 0 0; color: rgba(255,255,255,.77); font-size: 13px; }
    .weather-icon { font-size: 44px; filter: drop-shadow(0 5px 5px rgba(0,0,0,.12)); }
    .temperature { margin: 28px 0 0; font-size: clamp(62px, 14vw, 90px); font-weight: 720; letter-spacing: -.09em; line-height: .9; }
    .temperature sup { margin-left: 3px; font-size: .36em; font-weight: 500; letter-spacing: 0; vertical-align: top; }
    .condition { margin: 12px 0 0; font-size: 16px; font-weight: 650; }
    .range { margin: 4px 0 0; color: rgba(255,255,255,.75); font-size: 13px; }
    .details { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 25px; }
    .detail { padding: 10px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(255,255,255,.12); }
    .detail-label { margin: 0; color: rgba(255,255,255,.7); font-size: 11px; }
    .detail-value { margin: 2px 0 0; font-size: 13px; font-weight: 700; }

    .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 2px 13px; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .section-note { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
    .day { padding: 15px 8px; border: 1px solid var(--line); border-radius: 18px; text-align: center; background: var(--surface); box-shadow: 0 8px 24px rgba(30, 56, 102, .04); }
    .day-name { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .day-icon { margin: 13px 0 12px; font-size: 25px; }
    .day-temp { margin: 0; font-size: 15px; font-weight: 750; }
    .day-low { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .error { min-height: 20px; margin: 12px 2px 0; color: #d85d63; font-size: 13px; }
    footer { margin-top: 26px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--accent); }
    @media (max-width: 520px) {
      .app { width: min(100% - 24px, 720px); padding-top: 25px; }
      .status { display: none; }
      .current { padding: 23px; }
      .forecast { gap: 6px; }
      .day { padding: 13px 3px; }
      .day-icon { margin: 10px 0; }
      .search button { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="brand-mark">☀</div><div><p class="eyebrow">Ваш прогноз</p><h1>Погода рядом</h1></div></div>
      <div class="status"><span class="status-dot"></span><span id="statusText">Актуальные данные</span></div>
    </header>

    <form class="search" id="searchForm">
      <div class="search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="cityInput" type="search" placeholder="Найти город" aria-label="Название города" autocomplete="off" />
      </div>
      <button id="searchButton" type="submit">Найти</button>
    </form>

    <section class="current" aria-live="polite">
      <div class="current-top">
        <div><h2 class="current-location" id="location">Кишинёв, Молдова</h2><p class="current-date" id="date"></p></div>
        <div class="weather-icon" id="currentIcon">☀️</div>
      </div>
      <div class="current-bottom">
        <div><p class="temperature"><span id="temperature">24</span><sup>°C</sup></p><p class="condition" id="condition">Ясное небо</p><p class="range" id="range">Макс. 27° · Мин. 19°</p></div>
      </div>
      <div class="details">
        <div class="detail"><p class="detail-label">Ощущается как</p><p class="detail-value" id="feelsLike">24°</p></div>
        <div class="detail"><p class="detail-label">Влажность</p><p class="detail-value" id="humidity">—</p></div>
        <div class="detail"><p class="detail-label">Ветер</p><p class="detail-value" id="wind">—</p></div>
        <div class="detail"><p class="detail-label">Осадки</p><p class="detail-value" id="precipitation">—</p></div>
      </div>
    </section>

    <div class="section-heading"><h2>Прогноз на 5 дней</h2><span class="section-note">По дням</span></div>
    <section class="forecast" id="forecast"></section>
    <p class="error" id="error" role="status"></p>
    <footer>Данные: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · Температура в °C</footer>
  </main>

  <script>
    const fallback = {
      name: "Кишинёв", country: "Молдова",
      current: { temperature_2m: 22, apparent_temperature: 22, relative_humidity_2m: 58, wind_speed_10m: 12, wind_direction_10m: 180, precipitation: 0, weather_code: 0 },
      daily: { time: ["2026-09-29", "2026-09-30", "2026-10-01", "2026-10-02", "2026-10-03"], weather_code: [0, 1, 2, 61, 3], temperature_2m_max: [25, 24, 23, 20, 21], temperature_2m_min: [13, 14, 12, 11, 10], precipitation_probability_max: [0, 10, 25, 60, 30] }
    };
    const weather = {
      0: ["Ясное небо", "☀️"], 1: ["Преимущественно ясно", "🌤️"], 2: ["Переменная облачность", "⛅"], 3: ["Пасмурно", "☁️"],
      45: ["Туман", "🌫️"], 48: ["Туман", "🌫️"], 51: ["Небольшой моросящий дождь", "🌦️"], 53: ["Моросящий дождь", "🌦️"], 55: ["Сильный моросящий дождь", "🌧️"],
      61: ["Небольшой дождь", "🌦️"], 63: ["Дождь", "🌧️"], 65: ["Сильный дождь", "🌧️"], 71: ["Небольшой снег", "🌨️"], 73: ["Снег", "❄️"], 75: ["Сильный снег", "❄️"], 80: ["Ливни", "🌦️"], 81: ["Ливни", "🌧️"], 82: ["Сильные ливни", "⛈️"], 95: ["Гроза", "⛈️"], 96: ["Гроза с градом", "⛈️"], 99: ["Сильная гроза", "⛈️"]
    };
    const $ = (id) => document.getElementById(id);
    const dayName = (date, index) => index === 0 ? "Сегодня" : new Date(date + "T12:00:00").toLocaleDateString("ru-RU", { weekday: "short" });
    const formatDate = () => new Date().toLocaleDateString("ru-RU", { weekday: "long", month: "long", day: "numeric" });
    const windDirection = (degrees) => ["С", "СВ", "В", "ЮВ", "Ю", "ЮЗ", "З", "СЗ"][Math.round(degrees / 45) % 8];

    function render(data) {
      const current = data.current || fallback.current;
      const daily = data.daily;
      const [condition, icon] = weather[current.weather_code] || ["Переменная погода", "🌤️"];
      $("location").textContent = `${data.name}${data.country ? ", " + data.country : ""}`;
      $("date").textContent = formatDate();
      $("temperature").textContent = Math.round(current.temperature_2m);
      $("condition").textContent = condition;
      $("currentIcon").textContent = icon;
      $("range").textContent = `Макс. ${Math.round(daily.temperature_2m_max[0])}° · Мин. ${Math.round(daily.temperature_2m_min[0])}°`;
      $("feelsLike").textContent = `${Math.round(current.apparent_temperature ?? current.temperature_2m)}°`;
      $("humidity").textContent = `${Math.round(current.relative_humidity_2m ?? 0)}%`;
      $("wind").textContent = `${Math.round(current.wind_speed_10m ?? 0)} км/ч ${windDirection(current.wind_direction_10m ?? 0)}`;
      $("precipitation").textContent = `${Number(current.precipitation ?? 0).toFixed(1)} мм`;
      $("forecast").innerHTML = daily.time.slice(0, 5).map((date, i) => {
        const [label, dayIcon] = weather[daily.weather_code[i]] || ["Переменная", "🌤️"];
        const rainChance = daily.precipitation_probability_max?.[i];
        return `<article class="day"><p class="day-name">${dayName(date, i)}</p><div class="day-icon">${dayIcon}</div><p class="day-temp">${Math.round(daily.temperature_2m_max[i])}°</p><p class="day-low">${Math.round(daily.temperature_2m_min[i])}° · ${label}</p>${rainChance != null ? `<p class="day-low">💧 ${rainChance}%</p>` : ""}</article>`;
      }).join("");
    }

    async function loadCity(query = "Кишинёв") {
      $("searchButton").disabled = true;
      $("error").textContent = "";
      $("statusText").textContent = "Обновление…";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=ru&format=json`);
        if (!geoResponse.ok) throw new Error("Не удалось найти город");
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error(`Город «${query}» не найден`);
        const place = geo.results[0];
        const forecastResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5&timezone=auto`);
        if (!forecastResponse.ok) throw new Error("Прогноз недоступен");
        render({ ...await forecastResponse.json(), name: place.name, country: place.country });
        $("statusText").textContent = "Актуальные данные";
      } catch (error) {
        render(query.toLowerCase() === "кишинёв" || query.toLowerCase() === "chisinau" ? fallback : { ...fallback, name: query, country: "" });
        $("statusText").textContent = "Демо-режим";
        $("error").textContent = error.message.includes("не найден") ? error.message : "Нет связи с сервисом — показан пример прогноза.";
      } finally {
        $("searchButton").disabled = false;
      }
    }
    $("searchForm").addEventListener("submit", (event) => { event.preventDefault(); const query = $("cityInput").value.trim(); if (query) loadCity(query); });
    render(fallback);
    loadCity();
  </script>
</body>
</html>
